name: Validate Hephaestus

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; reviewed 2026-09-12
        with:
          persist-credentials: false
      - name: Static and packaging regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Build reproducible distributions
        run: python3 scripts/package.py
